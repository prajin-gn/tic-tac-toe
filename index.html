<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <title>Tic Tac Toe</title>
    </head>
    <body>
        <nav>
            <h1>Tic Tac Toe</h1>
        </nav>
        <main>
            <div id="gameWindow">
                <div id="board">
                    <div class="cell"></div>
                    <div class="cell centre-col"></div>
                    <div class="cell"></div>
                    <div class="cell centre-row"></div>
                    <div class="cell centre-row centre-col"></div>
                    <div class="cell centre-row"></div>
                    <div class="cell"></div>
                    <div class="cell centre-col"></div>
                    <div class="cell"></div>
                </div>
                <p id="turnIndicator">All The Best!</p>
            </div>
            <div id="stats"></div>
        </main>
        <footer>
            <small>
                <small>Made with ❤️ by Prajin GN &copy; 2026. All Rights Reserved</small>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
